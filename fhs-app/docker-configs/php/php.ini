; ---------------------------------------------------------------------------
; Custom PHP configuration for the Laravel app container.
; Loaded as /usr/local/etc/php/conf.d/zz-app.ini so it overrides defaults.
; ---------------------------------------------------------------------------

[PHP]
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 50

expose_php = Off
date.timezone = UTC

; Errors: verbose in dev, flip display_errors to Off for production builds
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

[Session]
session.gc_maxlifetime = 7200

[xdebug]
; Enable on demand by setting XDEBUG_MODE in docker-compose.yml (off by default)
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
